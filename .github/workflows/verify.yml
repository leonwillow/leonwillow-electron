name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:2026.09.0
        env:
          NEO4J_AUTH: neo4j/local-funds-dev
          NEO4J_server_memory_heap_max__size: 512m
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: leonwillow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/leonwillow_test
      BETTER_AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3001,http://localhost:3002
      VITE_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Start RustFS
        run: |
          docker run -d --name funds-rustfs -p 9000:9000 -e RUSTFS_ACCESS_KEY=local-funds -e RUSTFS_SECRET_KEY=local-funds-files-dev -v funds-rustfs-data:/data rustfs/rustfs:1.0.1 /data
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:9000/health; then exit 0; fi
            sleep 2
          done
          docker logs funds-rustfs
          exit 1
      - run: bun install --frozen-lockfile
      - run: bun run verify:all
      - run: bun run auth:schema
      - run: git diff --exit-code -- packages/db/src/schema/auth.ts
