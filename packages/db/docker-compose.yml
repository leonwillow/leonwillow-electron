# 文件意义：本地开发 PostgreSQL 服务配置。
# 创建时间：2026-10-03（Git 首次收录）
# 修改时间：2026-10-04
# 版本作用：当前工作区的工具/启动配置。
# 被调用：db:start/watch/stop/down 命令。
# 调用：Docker Compose、PostgreSQL 镜像。
# 功能：配置回环端口、持久化卷和健康检查。
# 预期结果：开发数据库可独立启动，数据保留在命名卷。

name: leonwillow-electron

services:
  postgres:
    image: postgres:18
    container_name: leonwillow-electron-postgres
    environment:
      POSTGRES_DB: leonwillow-electron
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - leonwillow-electron_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  leonwillow-electron_postgres_data:
