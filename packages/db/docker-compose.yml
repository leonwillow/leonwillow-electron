name: leonwillow-electron

services:
  postgres:
    image: postgres:18
    container_name: leonwillow-electron-postgres
    environment:
      POSTGRES_DB: leonwillow-electron
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - leonwillow-electron_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  leonwillow-electron_postgres_data:
